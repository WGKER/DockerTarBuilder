name: ARM64 Pull and Save Docker Image

on:
  workflow_dispatch:
    inputs:
      docker_images:
        description: '请填写docker镜像名称 多个用英文逗号分开'
        required: true
        default: 'mikebrady/shairport-sync:5.0.4'

jobs:
  pull_and_package:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull & Save
        run: |
          images="${{ github.event.inputs.docker_images }}"
          images=$(echo "$images" | tr -d ' ')
          IFS=',' read -r -a image_array <<< "$images"

          for image in "${image_array[@]}"; do
            safe="${image//\//_}"
            safe="${safe//:/-}"
            file="${safe}-arm64.tar"

            echo "Pull: $image"
            docker pull --platform linux/arm64 "$image"

            echo "Save: $file"
            docker save "$image" -o "$file"
          done

      - name: Upload each image
        run: |
          images="${{ github.event.inputs.docker_images }}"
          images=$(echo "$images" | tr -d ' ')
          IFS=',' read -r -a image_array <<< "$images"

          for image in "${image_array[@]}"; do
            safe="${image//\//_}"
            safe="${safe//:/-}"
            file="${safe}-arm64.tar"
            echo "Uploading $file ..."
            echo "::set-output name=imgfile::$file"
          done
        id: setfiles

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.setfiles.outputs.imgfile }}
          path: ${{ steps.setfiles.outputs.imgfile }}
          retention-days: 90

      - name: Clean up
        run: rm -f *.tar
