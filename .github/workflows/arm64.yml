name: ARM64 Pull and Save Docker Image

on:
  workflow_dispatch:
    inputs:
      docker_images:
        description: '请填写docker镜像名称 多个用英文逗号分开'
        required: true
        default: 'alpine:latest,ubuntu:latest'

jobs:
  pull-and-save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull and save each Docker image
        run: |
          images="${{ github.event.inputs.docker_images }}"
          images=$(echo "$images" | tr -d ' ')
          IFS=',' read -r -a img_arr <<< "$images"

          for image in "${img_arr[@]}"; do
            # 自动处理非法字符
            safe_name="${image//\//_}"
            safe_name="${safe_name//:/-}"
            tar_file="${safe_name}-arm64.tar"

            echo "===================================="
            echo "镜像：$image"
            echo "保存为：$tar_file"
            echo "===================================="

            docker pull --platform linux/arm64 "$image"
            docker save "$image" -o "$tar_file"

            # 循环内直接上传，自动用镜像名称
            echo "上传：$tar_file"
            gh artifact upload "$tar_file" "$tar_file"
          done

      - name: Clean
        run: rm -f *.tar
