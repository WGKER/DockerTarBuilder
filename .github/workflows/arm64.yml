name: ARM64 Pull and Save Docker Image

on:
  workflow_dispatch:
    inputs:
      docker_images:
        description: '请填写docker镜像名称 多个用英文逗号分开'
        required: true
        default: 'mikebrady/shairport-sync:5.0.4'

jobs:
  pull_and_package:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull & Save
        run: |
          images="${{ github.event.inputs.docker_images }}"
          images=$(echo "$images" | tr -d ' ')
          IFS=',' read -r -a image_array <<< "$images"

          for image in "${image_array[@]}"; do
            safe="${image//\//_}"
            safe="${safe//:/-}"
            file="${safe}-arm64.tar"

            echo "Pull: $image"
            docker pull --platform linux/arm64 "$image"

            echo "Save: $file"
            docker save "$image" -o "$file"
          done

      # 遍历文件，逐个上传（每个制品自动使用镜像名称）
      - name: Upload all saved images
        run: |
          for tar_file in *.tar; do
            echo "上传：$tar_file"
            # 动态上传，每个文件一个制品，名字就是文件名
            cat << EOF >> "$GITHUB_OUTPUT"
              path=$tar_file
              name=$tar_file
          EOF
          done
        id: uploadvars

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.setfiles.outputs.imgfile }}
          path: ${{ steps.setfiles.outputs.imgfile }}
          retention-days: 90

      - name: Clean up
        run: rm -f *.tar
